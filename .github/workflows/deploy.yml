name: Deploy

# main is the test channel and release the prod channel. A push builds the branch it lands on, and
# the deployment side rebuilds a channel when its environment changes, through a repository_dispatch:
# `test-deployed` for test, `prod-promoted` for prod. A build reads the channel's OpenAPI document
# from its API, so the reference is always what that environment serves.
on:
  push:
    branches: [main, release]
  repository_dispatch:
    types: [test-deployed, prod-promoted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ (github.ref_name == 'release' || github.event.action == 'prod-promoted') && 'prod' || 'test' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ (github.ref_name == 'release' || github.event.action == 'prod-promoted') && 'prod' || 'test' }}
    env:
      DOCS_CHANNEL: ${{ (github.ref_name == 'release' || github.event.action == 'prod-promoted') && 'prod' || 'test' }}
      # The release label while an API does not report one: the dispatch names it, prod falls back to the variable.
      DOCS_RELEASE: ${{ github.event.client_payload.version || (github.ref_name == 'release' && vars.DOCS_PROD_RELEASE) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A dispatch runs on the default branch; prod's content is the release branch.
          ref: ${{ env.DOCS_CHANNEL == 'prod' && 'release' || github.ref }}
      # The test channel's origins are configuration this public log may not show: the values are masked as
      # secrets, and their hosts are masked here so an error naming only the host stays masked too.
      - name: Mask the test channel's hosts
        if: env.DOCS_CHANNEL == 'test'
        env:
          DOCS_TEST_API_URL: ${{ secrets.DOCS_TEST_API_URL }}
          DOCS_TEST_CONSOLE_URL: ${{ secrets.DOCS_TEST_CONSOLE_URL }}
        run: |
          for url in "$DOCS_TEST_API_URL" "$DOCS_TEST_CONSOLE_URL"; do
            host="${url#*://}"
            host="${host%%/*}"
            [ -n "$host" ] && echo "::add-mask::$host"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          DOCS_TEST_API_URL: ${{ secrets.DOCS_TEST_API_URL }}
          DOCS_TEST_CONSOLE_URL: ${{ secrets.DOCS_TEST_CONSOLE_URL }}
      - run: |
          if [ "$DOCS_CHANNEL" = test ]; then set -- --env test; fi
          pnpm run deploy -- "$@"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
