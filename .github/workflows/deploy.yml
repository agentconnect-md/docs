name: Deploy

# main deploys the test channel, release the prod channel. A build resolves its release from the
# application repository's tags, so rerun the last run to pick up a release that shipped since.
on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.ref_name == 'release' && 'prod' || 'test' }}
    env:
      DOCS_CHANNEL: ${{ github.ref_name == 'release' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release's document never changes, so the last run's cache saves regenerating it.
      - uses: actions/cache@v4
        with:
          path: .cache/openapi
          key: openapi-${{ github.run_id }}
          restore-keys: openapi-
      - run: pnpm build
        env:
          DOCS_TEST_API_URL: ${{ secrets.DOCS_TEST_API_URL }}
          DOCS_TEST_CONSOLE_URL: ${{ secrets.DOCS_TEST_CONSOLE_URL }}
      - run: |
          if [ "$DOCS_CHANNEL" = test ]; then set -- --env test; fi
          pnpm run deploy -- "$@"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
