<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="900"
  viewBox="0 0 1600 900"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">How AgentConnect works</title>
  <desc id="description">
    Direct chat connections reach an AgentConnect daemon without passing through
    the Control Plane. Public callbacks can pass through an optional Relay. The
    Control Plane and console configure and observe the daemon, while ACP agents,
    workspaces, memory, tools, and skills run in the daemon environment.
  </desc>

  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="9"
        flood-color="#11161d"
        flood-opacity="0.08"
      />
    </filter>
    <marker
      id="arrow-pink"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62a78" />
    </marker>
    <marker
      id="arrow-teal"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
    <marker
      id="arrow-blue"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5" />
    </marker>
    <style>
      .title {
        font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #11161d;
      }
      .subtitle {
        font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #596473;
      }
      .card-title {
        font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #11161d;
      }
      .card-copy {
        font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #596473;
      }
      .eyebrow {
        font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 1.8px;
        fill: #7b8794;
      }
      .chip {
        font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #27313d;
      }
      .agent-title {
        font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #11161d;
      }
      .agent-copy {
        font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #657181;
      }
      .path-label {
        font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .footer {
        font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #596473;
      }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="#fbf7ef" />
  <text x="64" y="70" class="title">How AgentConnect works</text>
  <text x="64" y="108" class="subtitle">
    Work starts in the tools your team already uses.
  </text>

  <!-- Control Plane and console -->
  <g filter="url(#shadow)">
    <rect
      x="690"
      y="50"
      width="840"
      height="140"
      rx="20"
      fill="#eef2ff"
      stroke="#8b87f7"
      stroke-width="2"
    />
  </g>
  <rect x="722" y="83" width="42" height="42" rx="11" fill="#4f46e5" />
  <text
    x="743"
    y="111"
    text-anchor="middle"
    style="font:700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#ffffff"
  >
    AC
  </text>
  <text x="782" y="104" class="card-title">Control Plane + console</text>
  <text x="782" y="137" class="card-copy">
    Configure the fleet, permissions, schedules, and the work each person may see.
  </text>
  <rect x="1282" y="83" width="214" height="38" rx="10" fill="#ffffff" />
  <text
    x="1389"
    y="108"
    text-anchor="middle"
    style="font:700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#4f46e5"
  >
    NO LIVE WORK PATH
  </text>
  <line
    x1="1110"
    y1="190"
    x2="1110"
    y2="276"
    stroke="#4f46e5"
    stroke-width="4"
    stroke-dasharray="10 9"
    marker-start="url(#arrow-blue)"
    marker-end="url(#arrow-blue)"
  />
  <text x="1130" y="255" class="path-label" fill="#4f46e5">
    Control, telemetry, authorized reads
  </text>

  <!-- Channels and event sources -->
  <g filter="url(#shadow)">
    <rect
      x="64"
      y="190"
      width="450"
      height="410"
      rx="22"
      fill="#ffffff"
      stroke="#c9d0d9"
      stroke-width="2"
    />
  </g>
  <text x="100" y="242" class="card-title">Channels &amp; events</text>
  <text x="100" y="276" class="card-copy">Start work from a conversation or trigger.</text>

  <text x="100" y="325" class="eyebrow">DIRECT CONNECTIONS</text>
  <rect x="100" y="344" width="106" height="42" rx="10" fill="#f4f6f8" />
  <text x="153" y="371" text-anchor="middle" class="chip">Slack</text>
  <rect x="218" y="344" width="132" height="42" rx="10" fill="#f4f6f8" />
  <text x="284" y="371" text-anchor="middle" class="chip">Telegram</text>
  <rect x="362" y="344" width="116" height="42" rx="10" fill="#f4f6f8" />
  <text x="420" y="371" text-anchor="middle" class="chip">Discord</text>
  <rect x="100" y="398" width="188" height="42" rx="10" fill="#f4f6f8" />
  <text x="194" y="425" text-anchor="middle" class="chip">Lark / Feishu</text>

  <text x="100" y="480" class="eyebrow">PUBLIC CALLBACKS</text>
  <rect x="100" y="499" width="242" height="42" rx="10" fill="#f4f6f8" />
  <text x="221" y="526" text-anchor="middle" class="chip">Slack / Lark / Feishu HTTP</text>
  <rect x="354" y="499" width="124" height="42" rx="10" fill="#f4f6f8" />
  <text x="416" y="526" text-anchor="middle" class="chip">GitHub</text>
  <rect x="100" y="547" width="132" height="42" rx="10" fill="#f4f6f8" />
  <text x="166" y="574" text-anchor="middle" class="chip">Webhook</text>
  <rect x="244" y="547" width="116" height="42" rx="10" fill="#f4f6f8" />
  <text x="302" y="574" text-anchor="middle" class="chip">Webchat</text>

  <!-- Direct live path -->
  <line
    x1="514"
    y1="365"
    x2="690"
    y2="365"
    stroke="#c62a78"
    stroke-width="6"
    marker-start="url(#arrow-pink)"
    marker-end="url(#arrow-pink)"
  />
  <text x="602" y="342" text-anchor="middle" class="path-label" fill="#a82165">
    Direct live work
  </text>

  <!-- Optional Relay path -->
  <path
    d="M 514 550 H 550 V 623"
    fill="none"
    stroke="#0f766e"
    stroke-width="5"
    marker-end="url(#arrow-teal)"
  />
  <text x="542" y="612" text-anchor="end" class="path-label" fill="#0f766e">
    Callback ingress
  </text>
  <g filter="url(#shadow)">
    <rect
      x="246"
      y="625"
      width="364"
      height="150"
      rx="20"
      fill="#ecfeff"
      stroke="#0f766e"
      stroke-width="2"
    />
  </g>
  <text x="278" y="673" class="card-title">Relay</text>
  <rect x="380" y="644" width="110" height="34" rx="17" fill="#ccfbf1" />
  <text
    x="435"
    y="667"
    text-anchor="middle"
    style="font:700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#0f766e"
  >
    OPTIONAL
  </text>
  <text x="278" y="707" class="card-copy">Verify callbacks and forward them</text>
  <text x="278" y="737" class="card-copy">without persisting message content.</text>
  <line
    x1="610"
    y1="700"
    x2="690"
    y2="700"
    stroke="#0f766e"
    stroke-width="6"
    marker-end="url(#arrow-teal)"
  />

  <!-- Daemon and local execution -->
  <g filter="url(#shadow)">
    <rect
      x="690"
      y="276"
      width="840"
      height="500"
      rx="26"
      fill="#fff7ed"
      stroke="#c62a78"
      stroke-width="3"
    />
  </g>
  <rect x="726" y="310" width="46" height="46" rx="13" fill="#c62a78" />
  <circle cx="741" cy="331" r="4" fill="#ffffff" />
  <circle cx="757" cy="331" r="4" fill="#ffffff" />
  <path d="M 740 344 Q 749 350 758 344" fill="none" stroke="#ffffff" stroke-width="3" />
  <text x="792" y="332" class="card-title">AgentConnect daemon</text>
  <text x="792" y="365" class="card-copy">
    Runs agents over local ACP on your laptop, workstation, VM, or server.
  </text>
  <rect x="1345" y="315" width="148" height="38" rx="10" fill="#fcebf3" />
  <text
    x="1419"
    y="340"
    text-anchor="middle"
    style="font:700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#a82165"
  >
    YOUR ENVIRONMENT
  </text>

  <text x="732" y="414" class="eyebrow">SPECIALIZED AGENTS</text>
  <rect x="732" y="432" width="220" height="132" rx="16" fill="#ffffff" stroke="#e7c7d7" />
  <circle cx="770" cy="469" r="19" fill="#241531" />
  <text
    x="770"
    y="475"
    text-anchor="middle"
    style="font:700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#ffffff"
  >
    C
  </text>
  <text x="802" y="467" class="agent-title">Claude Code</text>
  <text x="802" y="493" class="agent-copy">support-agent</text>
  <text x="758" y="536" class="agent-copy">Role · workspace</text>

  <rect x="976" y="432" width="220" height="132" rx="16" fill="#ffffff" stroke="#e7c7d7" />
  <circle cx="1014" cy="469" r="19" fill="#11161d" />
  <text
    x="1014"
    y="475"
    text-anchor="middle"
    style="font:700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#ffffff"
  >
    O
  </text>
  <text x="1046" y="467" class="agent-title">Codex</text>
  <text x="1046" y="493" class="agent-copy">review-agent</text>
  <text x="1002" y="536" class="agent-copy">Model · permissions</text>

  <rect x="1220" y="432" width="274" height="132" rx="16" fill="#ffffff" stroke="#e7c7d7" />
  <circle cx="1258" cy="469" r="19" fill="#f1e7f7" />
  <text
    x="1258"
    y="475"
    text-anchor="middle"
    style="font:700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#7c3ca2"
  >
    +
  </text>
  <text x="1290" y="467" class="agent-title">Any ACP agent</text>
  <text x="1290" y="493" class="agent-copy">your next specialist</text>
  <text x="1246" y="536" class="agent-copy">Can call other agents</text>

  <line x1="952" y1="498" x2="976" y2="498" stroke="#c62a78" stroke-width="3" />
  <line x1="1196" y1="498" x2="1220" y2="498" stroke="#c62a78" stroke-width="3" />

  <text x="732" y="612" class="eyebrow">LOCAL EXECUTION CONTEXT</text>
  <rect x="732" y="632" width="232" height="76" rx="14" fill="#ffffff" stroke="#ead8c8" />
  <text x="848" y="663" text-anchor="middle" class="agent-title">Workspaces &amp; git</text>
  <text x="848" y="691" text-anchor="middle" class="agent-copy">code and credentials</text>
  <rect x="984" y="632" width="202" height="76" rx="14" fill="#ffffff" stroke="#ead8c8" />
  <text x="1085" y="663" text-anchor="middle" class="agent-title">Memory</text>
  <text x="1085" y="691" text-anchor="middle" class="agent-copy">native or connected</text>
  <rect x="1206" y="632" width="288" height="76" rx="14" fill="#ffffff" stroke="#ead8c8" />
  <text x="1350" y="663" text-anchor="middle" class="agent-title">Tools &amp; skills</text>
  <text x="1350" y="691" text-anchor="middle" class="agent-copy">selected for each agent</text>
  <text x="732" y="748" class="card-copy">
    Transcripts, workspaces, and agent execution remain with the daemon.
  </text>

  <!-- Legend -->
  <line x1="64" y1="832" x2="94" y2="832" stroke="#c62a78" stroke-width="6" />
  <line x1="94" y1="832" x2="124" y2="832" stroke="#0f766e" stroke-width="6" />
  <text x="140" y="839" class="footer">Live work</text>
  <line
    x1="272"
    y1="832"
    x2="324"
    y2="832"
    stroke="#4f46e5"
    stroke-width="4"
    stroke-dasharray="9 8"
  />
  <text x="340" y="839" class="footer">Control and authorized reads</text>
  <text x="1530" y="839" text-anchor="end" class="footer">
    The Control Plane is never on the live work path.
  </text>
</svg>
